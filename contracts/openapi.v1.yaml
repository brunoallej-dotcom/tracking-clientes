openapi: 3.1.0
info:
  title: Tracking Clientes API
  version: 1.0.0
  summary: API do rastreador de entregas por cliente (painel CEO + painel do cliente).
  license:
    name: Proprietário — uso interno
    identifier: LicenseRef-Proprietary
  description: |
    Contrato **API-first** do backend. Comportamento e regras: `docs/specs/client-delivery-tracking.md`.
    Controles de segurança: `docs/specs/security-baseline.md`. O código segue este contrato,
    nunca o contrário. Mudança incompatível = nova versão (`/api/v2`) + nota de compatibilidade.

    ## Autenticação
    Sessão do Supabase Auth em cookies `HttpOnly; Secure; SameSite=Lax`, definidos por
    `POST /auth/login`. O navegador nunca fala direto com o Supabase. Toda rota exige sessão,
    exceto as marcadas com `security: []`.

    ## Autorização
    - `x-roles` indica os papéis aceitos (`ceo`, `client` ou `public`).
    - Rotas `/admin/*`: só `ceo`. Rotas `/portal/*`: `ceo` e `client`.
    - O tenant do usuário `client` vem do perfil no servidor. Nenhum parâmetro escolhe o cliente no portal.
    - Recurso fora do escopo do usuário → `404`. Papel sem acesso à rota → `403`.
    - Com `mustChangePassword = true`, só `GET /me`, `POST /auth/password` e `POST /auth/logout`
      respondem; o resto retorna `403 PASSWORD_CHANGE_REQUIRED`.

    ## Requisições
    - Mutações (`POST`, `PUT`, `PATCH`, `DELETE`) exigem o header `Origin` igual à origem da
      aplicação; senão → `403 ORIGIN_NOT_ALLOWED`.
    - Corpo JSON (`Content-Type: application/json`) de até 16 KB. Campos desconhecidos são
      rejeitados (`400`).
    - Paginação por `limit` (1–100, padrão 20) + `cursor` opaco. Resposta `{ items, nextCursor }`.

    ## Respostas
    - Toda resposta traz `X-Request-Id`, `Cache-Control: no-store` e os headers de segurança.
    - Erros seguem a RFC 9457 (`application/problem+json`) com `code` estável (ver `ErrorCode`)
      e `requestId`. Nunca contêm stack trace, SQL ou detalhes internos.

    ## Extensões
    - `x-wave`: onda de implementação (`docs/plan/implementation-waves.md`).
    - `x-roles`: papéis autorizados.
    - `x-rate-limit`: limite aplicado à operação.
servers:
  - url: http://localhost:3000/api/v1
    description: Desenvolvimento local
  - url: https://{host}/api/v1
    description: Staging / produção
    variables:
      host:
        default: seu-dominio.com.br
        description: Domínio da aplicação (a definir).
security:
  - sessionCookie: []
tags:
  - name: Health
    description: Monitoramento (público).
  - name: Auth
    description: Login, logout e troca de senha.
  - name: Me
    description: Dados do usuário autenticado.
  - name: Portal
    description: Painel do cliente — rastreamento visível ao cliente (e aos CEOs, como preview).
  - name: Admin - Clients
    description: Painel CEO — clientes (tenants).
  - name: Admin - Users
    description: Painel CEO — logins dos clientes.
  - name: Admin - Projects
    description: Painel CEO — projetos e ciclo de vida.
  - name: Admin - Stages
    description: Painel CEO — montagem e avanço do fluxo de entrega.
  - name: Admin - Notes
    description: Painel CEO — notas internas (nunca visíveis ao cliente).
  - name: Admin - Audit
    description: Painel CEO — trilha de auditoria.
  - name: Admin - Templates
    description: Painel CEO — templates de fluxo (opcional, Onda 10).

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness da API
      description: Exceção pública explícita. Não expõe versão, dependências nem detalhes internos.
      security: []
      x-wave: 0
      x-roles: [public]
      x-rate-limit: 60/min por IP
      responses:
        '200':
          description: API no ar.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      operationId: loginWithPassword
      tags: [Auth]
      summary: Login com e-mail e senha (RF-01)
      description: |
        Define os cookies de sessão. Qualquer falha de credencial (e-mail inexistente, senha errada,
        usuário ou cliente inativo) retorna a mesma resposta `401 INVALID_CREDENTIALS`.
      security: []
      x-wave: 3
      x-roles: [public]
      x-rate-limit: 5/15min por (IP, e-mail) e 20/15min por IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado. Cookies de sessão definidos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout (RF-02)
      description: Revoga a sessão atual e limpa os cookies. Idempotente — sem sessão também retorna 204.
      security:
        - sessionCookie: []
        - {}
      x-wave: 3
      x-roles: [ceo, client, public]
      responses:
        '204':
          description: Sessão encerrada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Trocar a própria senha (RF-04)
      description: |
        Permitido mesmo com `mustChangePassword = true`. Em caso de sucesso, zera
        `mustChangePassword` e revoga as demais sessões do usuário.
      x-wave: 3
      x-roles: [ceo, client]
      x-rate-limit: 5/15min por usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Senha alterada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: Dados do usuário autenticado (RF-03)
      description: Permitido mesmo com `mustChangePassword = true`.
      x-wave: 3
      x-roles: [ceo, client]
      responses:
        '200':
          description: Usuário autenticado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /portal/projects:
    get:
      operationId: listPortalProjects
      tags: [Portal]
      summary: Listar projetos visíveis no painel do cliente (RF-30)
      description: |
        Usuário `client`: só projetos do próprio cliente com status `active` ou `completed`.
        CEO: todos os projetos (preview). Não existe parâmetro para escolher o cliente.
      x-wave: 8
      x-roles: [ceo, client]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de projetos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalProjectPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /portal/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getPortalProject
      tags: [Portal]
      summary: Rastreamento de um projeto (RF-31)
      description: |
        Linha do tempo com o estado de cada fase. O DTO contém só campos publicáveis: nunca notas
        internas, autor da conclusão, motivo de reabertura nem e-mails. O CEO recebe o mesmo DTO
        que o cliente veria.
      x-wave: 8
      x-roles: [ceo, client]
      responses:
        '200':
          description: Rastreamento do projeto.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/clients:
    get:
      operationId: listClients
      tags: [Admin - Clients]
      summary: Listar clientes (RF-11)
      x-wave: 4
      x-roles: [ceo]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de clientes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createClient
      tags: [Admin - Clients]
      summary: Cadastrar cliente (RF-10)
      x-wave: 4
      x-roles: [ceo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Cliente criado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      operationId: getClient
      tags: [Admin - Clients]
      summary: Detalhar cliente com usuários e projetos (RF-11)
      x-wave: 4
      x-roles: [ceo]
      responses:
        '200':
          description: Cliente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateClient
      tags: [Admin - Clients]
      summary: Editar ou desativar/reativar cliente (RF-12)
      description: |
        `isActive: false` bloqueia imediatamente todos os usuários do cliente (RLS), revoga as
        sessões e bane o login no Supabase Auth. `isActive: true` remove o ban dos usuários ativos.
      x-wave: 4
      x-roles: [ceo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Cliente atualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/clients/{clientId}/users:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: createClientUser
      tags: [Admin - Users]
      summary: Criar login de usuário do cliente (RF-13)
      description: |
        Cria o usuário no Supabase Auth (e-mail confirmado) e o perfil, de forma atômica, com
        `mustChangePassword = true`. Sem `temporaryPassword`, o servidor gera uma senha forte e a
        devolve **uma única vez** em `temporaryPassword`.
      x-wave: 4
      x-roles: [ceo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientUserRequest'
      responses:
        '201':
          description: Usuário criado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientUserResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateClientUser
      tags: [Admin - Users]
      summary: Editar ou desativar/reativar usuário do cliente (RF-14)
      description: Atua só sobre usuários `client`. Alvo CEO ou inexistente → 404.
      x-wave: 4
      x-roles: [ceo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users/{userId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: resetClientUserPassword
      tags: [Admin - Users]
      summary: Resetar senha de usuário do cliente (RF-15)
      description: |
        Define uma senha temporária (informada ou gerada), liga `mustChangePassword` e revoga todas
        as sessões do usuário. A senha gerada é devolvida uma única vez.
      x-wave: 4
      x-roles: [ceo]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Senha redefinida.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/projects:
    get:
      operationId: listProjects
      tags: [Admin - Projects]
      summary: Listar projetos (RF-21)
      x-wave: 5
      x-roles: [ceo]
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de projetos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProjectPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      tags: [Admin - Projects]
      summary: Criar projeto em draft (RF-20, RF-51)
      description: |
        Cria o projeto e as fases atomicamente, em `draft`. `stages` e `templateId` (Onda 10) são
        mutuamente exclusivos. `clientId` ou `templateId` inexistente → 404.
      x-wave: 5
      x-roles: [ceo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Projeto criado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Admin - Projects]
      summary: Detalhar projeto com fluxo completo (RF-21)
      x-wave: 5
      x-roles: [ceo]
      responses:
        '200':
          description: Projeto.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      tags: [Admin - Projects]
      summary: Editar nome/descrição do projeto (RF-22)
      x-wave: 5
      x-roles: [ceo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Projeto atualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
