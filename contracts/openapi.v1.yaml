components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: |
        Cookie de sessão do Supabase Auth gerenciado pelo `@supabase/ssr` (nome real
        `sb-<project-ref>-auth-token`, possivelmente fragmentado em `.0`, `.1`). Flags:
        `HttpOnly; Secure; SameSite=Lax; Path=/`. Nunca acessível por JavaScript.

  headers:
    XRequestId:
      description: ID de correlação da requisição (propagado nos logs e na auditoria).
      schema:
        type: string
        maxLength: 128
    RetryAfter:
      description: Segundos até a próxima tentativa permitida.
      schema:
        type: integer
        minimum: 1
    SetCookie:
      description: Cookies de sessão (`HttpOnly; Secure; SameSite=Lax`).
      schema:
        type: string

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devolvido em `nextCursor`.
      schema:
        type: string
        maxLength: 256
        pattern: '^[A-Za-z0-9_-]+$'

  responses:
    ValidationFailed:
      description: Entrada inválida (`VALIDATION_FAILED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Requisição inválida
            status: 400
            code: VALIDATION_FAILED
            requestId: 01JD7Z3K9Q6F2X8M4N5P7R2S1T
            errors:
              - path: name
                message: Deve ter entre 2 e 120 caracteres.
    Unauthenticated:
      description: Sessão ausente, expirada, usuário ou cliente inativo (`UNAUTHENTICATED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: |
        Credenciais inválidas (`INVALID_CREDENTIALS`) — mensagem genérica, sem indicar o motivo.
        Em rotas autenticadas, também pode ser `UNAUTHENTICATED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Acesso negado: papel sem permissão (`FORBIDDEN`), troca de senha pendente
        (`PASSWORD_CHANGE_REQUIRED`) ou origem não permitida em mutação (`ORIGIN_NOT_ALLOWED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente ou fora do escopo do usuário (`NOT_FOUND`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Violação de regra de negócio ou de estado (ver `ErrorCode`, status 409).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: A fase informada não é a fase atual
            status: 409
            code: STAGE_NOT_CURRENT
            requestId: 01JD7Z3K9Q6F2X8M4N5P7R2S1T
    PayloadTooLarge:
      description: Corpo maior que 16 KB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: '`Content-Type` diferente de `application/json` (`UNSUPPORTED_MEDIA_TYPE`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Limite de requisições excedido (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Erro inesperado (`INTERNAL_ERROR`). Detalhes só no log do servidor, pelo `requestId`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependência indisponível — Supabase Auth ou armazenamento de rate limit (`SERVICE_UNAVAILABLE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- Primitivos ----------
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 em UTC.
    NullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    CalendarDate:
      type: string
      format: date
      description: Data sem horário (`YYYY-MM-DD`).
    NullableCalendarDate:
      oneOf:
        - $ref: '#/components/schemas/CalendarDate'
        - type: 'null'
    Title:
      type: string
      minLength: 2
      maxLength: 120
      description: Texto puro, após trim. Caracteres de controle são rejeitados.
    Description:
      type: string
      maxLength: 2000
      description: Texto puro (renderizado como texto, nunca HTML). Permite `\n` e `\t`.
    NullableDescription:
      oneOf:
        - $ref: '#/components/schemas/Description'
        - type: 'null'
    Email:
      type: string
      format: email
      maxLength: 254
      description: Normalizado para minúsculas no servidor.
    TemporaryPassword:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
    NextCursor:
      oneOf:
        - type: string
          maxLength: 256
        - type: 'null'

    # ---------- Enums ----------
    Role:
      type: string
      enum: [ceo, client]
    ProjectStatus:
      type: string
      enum: [draft, active, completed, archived]
    StageState:
      type: string
      enum: [completed, current, upcoming]
      description: |
        Derivado: `completed` se concluída; `current` se for a primeira não concluída de um projeto
        `active`; senão `upcoming`.
    AuditAction:
      type: string
      pattern: '^[a-z_]+\.[a-z_]+$'
      maxLength: 64
      examples:
        - stage.completed
        - project.published
        - user.created
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - ORIGIN_NOT_ALLOWED
        - NOT_FOUND
        - CLIENT_NAME_TAKEN
        - CLIENT_INACTIVE
        - EMAIL_ALREADY_REGISTERED
        - INVALID_STATUS_TRANSITION
        - PROJECT_NOT_ACTIVE
        - PROJECT_ARCHIVED
        - PROJECT_HAS_NO_STAGES
        - PROJECT_REQUIRES_STAGE
        - STAGE_NOT_CURRENT
        - STAGE_ALREADY_COMPLETED
        - NOT_LAST_COMPLETED_STAGE
        - STAGE_LOCKED
        - STAGE_LIMIT_REACHED
        - TEMPLATE_NAME_TAKEN
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE

    # ---------- Erros ----------
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: '`about:blank` ou URI de documentação do problema.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Explicação segura para o usuário. Nunca contém SQL, stack trace ou dados de outro tenant.
        requestId:
          type: string
        errors:
          type: array
          description: Presente em `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Caminho do campo (ex.. `stages.2.title`).
        message:
          type: string

    # ---------- Referências ----------
    ClientRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: string
    StageRef:
      type: object
      required: [id, title]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
    Progress:
      type: object
      required: [completed, total]
      properties:
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    # ---------- Health ----------
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    # ---------- Auth / Me ----------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12–128 caracteres, diferente da atual e fora da lista de senhas comuns.
    Me:
      type: object
      required: [id, fullName, role, client, mustChangePassword]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        client:
          description: Cliente do usuário; `null` para CEO.
          oneOf:
            - $ref: '#/components/schemas/ClientRef'
            - type: 'null'
        mustChangePassword:
          type: boolean

    # ---------- Portal ----------
    PortalProjectSummary:
      type: object
      required: [id, name, status, progress, currentStage, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        progress:
          $ref: '#/components/schemas/Progress'
        currentStage:
          oneOf:
            - $ref: '#/components/schemas/StageRef'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PortalProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalProjectSummary'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    PortalStage:
      type: object
      description: Somente campos publicáveis ao cliente.
      required: [id, position, title, description, expectedDate, state, completedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 1
          maximum: 50
        title:
          type: string
        description:
          $ref: '#/components/schemas/NullableDescription'
        expectedDate:
          $ref: '#/components/schemas/NullableCalendarDate'
        state:
          $ref: '#/components/schemas/StageState'
        completedAt:
          $ref: '#/components/schemas/NullableTimestamp'
    PortalProjectDetail:
      type: object
      required: [id, name, description, status, client, startedAt, completedAt, progress, stages]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        description:
          $ref: '#/components/schemas/NullableDescription'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        client:
          $ref: '#/components/schemas/ClientRef'
        startedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        completedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        progress:
          $ref: '#/components/schemas/Progress'
        stages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PortalStage'

    # ---------- Admin: clients & users ----------
    Client:
      type: object
      required: [id, name, isActive, userCount, projectCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        isActive:
          type: boolean
        userCount:
          type: integer
          minimum: 0
        projectCount:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          required: [users, projects]
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            projects:
              type: array
              items:
                $ref: '#/components/schemas/AdminProjectSummary'
    ClientPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Title'
    UpdateClientRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/Title'
        isActive:
          type: boolean
    AdminUser:
      type: object
      required: [id, email, fullName, role, clientId, isActive, mustChangePassword, createdAt, lastSignInAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        clientId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSignInAt:
          $ref: '#/components/schemas/NullableTimestamp'
    CreateClientUserRequest:
      type: object
      additionalProperties: false
      required: [email, fullName]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        fullName:
          $ref: '#/components/schemas/Title'
        temporaryPassword:
          $ref: '#/components/schemas/TemporaryPassword'
    CreateClientUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        temporaryPassword:
          type: string
          readOnly: true
          description: Presente somente quando a senha foi gerada pelo servidor. Exibir uma única vez; nunca logar.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          $ref: '#/components/schemas/Title'
        isActive:
          type: boolean
    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        temporaryPassword:
          $ref: '#/components/schemas/TemporaryPassword'
    PasswordResetResponse:
      type: object
      properties:
        temporaryPassword:
          type: string
          readOnly: true
          description: Presente somente quando a senha foi gerada pelo servidor.

    # ---------- Admin: projects & stages ----------
    AdminProjectSummary:
      type: object
      required: [id, client, name, status, progress, currentStage, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        client:
          $ref: '#/components/schemas/ClientRef'
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        progress:
          $ref: '#/components/schemas/Progress'
        currentStage:
          oneOf:
            - $ref: '#/components/schemas/StageRef'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    AdminProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProjectSummary'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    AdminStage:
      type: object
      required: [id, position, title, description, expectedDate, state, completedAt, completedBy, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 1
          maximum: 50
        title:
          type: string
        description:
          $ref: '#/components/schemas/NullableDescription'
        expectedDate:
          $ref: '#/components/schemas/NullableCalendarDate'
        state:
          $ref: '#/components/schemas/StageState'
        completedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        completedBy:
          description: CEO que concluiu a fase (derivado da auditoria). Nunca exposto no portal.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    AdminProjectDetail:
      type: object
      required: [id, client, name, description, status, startedAt, completedAt, createdAt, updatedAt, progress, stages]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        client:
          $ref: '#/components/schemas/ClientRef'
        name:
          type: string
        description:
          $ref: '#/components/schemas/NullableDescription'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        startedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        completedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        progress:
          $ref: '#/components/schemas/Progress'
        stages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdminStage'
    NewStage:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/NullableDescription'
        expectedDate:
          $ref: '#/components/schemas/NullableCalendarDate'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [clientId, name]
      not:
        required: [stages, templateId]
      properties:
        clientId:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/NullableDescription'
        stages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/NewStage'
        templateId:
          description: Onda 10 (opcional). Mutuamente exclusivo com `stages`.
          allOf:
            - $ref: '#/components/schemas/Uuid'
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/NullableDescription'
    AddStageRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/NullableDescription'
        expectedDate:
          $ref: '#/components/schemas/NullableCalendarDate'
        position:
          type: integer
          minimum: 1
          maximum: 50
          description: Posição desejada (1 = primeira). Omitido = fim do fluxo.
    UpdateStageRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/NullableDescription'
        expectedDate:
          $ref: '#/components/schemas/NullableCalendarDate'
    ReorderStagesRequest:
      type: object
      additionalProperties: false
      required: [stageIds]
      properties:
        stageIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    ReopenStageRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Justificativa (registrada só na auditoria interna).

    # ---------- Admin: notes & audit ----------
    InternalNote:
      type: object
      required: [id, projectId, stageId, author, body, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        projectId:
          $ref: '#/components/schemas/Uuid'
        stageId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        author:
          $ref: '#/components/schemas/UserRef'
        body:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    InternalNotePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InternalNote'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    CreateInternalNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        stageId:
          $ref: '#/components/schemas/Uuid'
    AuditEvent:
      type: object
      required: [id, occurredAt, actor, action, entityType, entityId, clientId, projectId, metadata, requestId]
      properties:
        id:
          type: string
          description: Identificador sequencial (bigint serializado como string).
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        actor:
          description: Autor da ação; `null` = sistema.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          type: string
        entityId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        clientId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        projectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        metadata:
          type: object
          description: Dados adicionais sem PII (ex.. `reason` de reabertura, posições antigas/novas).
          additionalProperties: true
        requestId:
          oneOf:
            - type: string
            - type: 'null'
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- Admin: templates (Onda 10) ----------
    FlowTemplateStage:
      type: object
      required: [position, title, description]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 50
        title:
          type: string
        description:
          $ref: '#/components/schemas/NullableDescription'
    FlowTemplate:
      type: object
      required: [id, name, stages, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        stages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FlowTemplateStage'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    FlowTemplateSummary:
      type: object
      required: [id, name, stageCount, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        stageCount:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    FlowTemplatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlowTemplateSummary'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    TemplateStageInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/NullableDescription'
    CreateFlowTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, stages]
      properties:
        name:
          $ref: '#/components/schemas/Title'
        stages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/TemplateStageInput'
    UpdateFlowTemplateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/Title'
        stages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/TemplateStageInput'
